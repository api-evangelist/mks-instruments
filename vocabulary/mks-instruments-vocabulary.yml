vocabulary:
  name: MKS Instruments Industrial Technology Vocabulary
  description: >-
    Key terms and concepts covering the industrial, semiconductor, and scientific
    instrumentation domains that MKS Instruments operates in. Covers vacuum
    technology, gas delivery, process control, photonics, lasers, and motion
    control — the core product and integration vocabulary used across MKS product
    lines and partner integration documentation.
  version: "1.0.0"
  terms:

    - term: Mass Flow Controller
      definition: >-
        A device that measures and controls the volumetric or mass flow rate of
        a gas or liquid. Used in semiconductor process chambers and chemical
        vapor deposition (CVD) systems to deliver precise quantities of
        process gases. Typically controlled via analog (0-5 V or 4-20 mA)
        or digital (RS-232, EtherCAT, DeviceNet) interfaces.
      tags:
        - gas-delivery
        - flow-control
        - semiconductor
        - instrumentation

    - term: Vacuum Gauge
      definition: >-
        An instrument that measures gas pressure below atmospheric in a vacuum
        system. MKS product lines span Baratron capacitance manometers for
        high-accuracy absolute pressure, Pirani gauges for medium vacuum, and
        cold-cathode ionization gauges for high and ultra-high vacuum ranges.
      tags:
        - vacuum-technology
        - pressure-measurement
        - instrumentation

    - term: Process Control
      definition: >-
        The use of automated feedback loops to regulate manufacturing process
        parameters — pressure, flow, temperature, power — within defined
        setpoints. In semiconductor fabs, process control maintains chamber
        conditions during etch, deposition, and implant steps to achieve
        wafer-level uniformity and yield targets.
      tags:
        - process-control
        - automation
        - semiconductor
        - manufacturing

    - term: RF Power Generator
      definition: >-
        A radio-frequency power source used to create and sustain plasma in
        semiconductor process chambers (etch, CVD, PVD). Delivers controlled
        RF energy at 13.56 MHz or harmonics to the process electrode; often
        paired with an automatic matching network to maintain impedance match
        as plasma load changes.
      tags:
        - plasma
        - semiconductor
        - power-electronics
        - process-control

    - term: Capacitance Manometer
      definition: >-
        A precision absolute pressure sensor based on the deflection of a
        tensioned metal diaphragm whose capacitance changes with applied
        pressure. The Baratron line is gas-species independent, making it
        the metrology standard for pressure control in process chambers
        from 10^-4 Torr to atmospheric pressure.
      tags:
        - pressure-measurement
        - vacuum-technology
        - metrology
        - instrumentation

    - term: Ultrafast Laser
      definition: >-
        A pulsed laser system delivering pulse durations in the picosecond
        or femtosecond range, enabling precise material ablation with
        minimal heat-affected zone. Used in microelectronics drilling,
        medical device cutting, and scientific research. Key parameters
        include pulse energy, repetition rate, wavelength, and M² beam
        quality factor.
      tags:
        - laser
        - photonics
        - micromachining
        - ultrafast

    - term: Gas Panel
      definition: >-
        A modular assembly of valves, regulators, filters, and mass flow
        controllers that conditions and distributes process gases from
        supply cylinders to semiconductor process equipment. Designed for
        safe handling of toxic, flammable, or corrosive gases with
        automated leak-detection and purge sequences.
      tags:
        - gas-delivery
        - semiconductor
        - safety
        - manufacturing

    - term: Motion Stage
      definition: >-
        A precision mechanical assembly providing controlled linear or
        rotary motion for positioning optical components, wafers, or
        workpieces. Characterized by travel range, positional accuracy,
        repeatability, and maximum velocity. Encoder feedback (optical
        or magnetic) closes the servo loop to the motion controller.
      tags:
        - motion-control
        - precision-positioning
        - automation
        - photonics

    - term: Plasma
      definition: >-
        A partially ionized gas consisting of electrons, ions, and neutral
        species generated by coupling RF or microwave energy into a
        low-pressure gas. In semiconductor fabrication, plasma enables
        dry etching of dielectric and metal films and deposition of thin
        films via plasma-enhanced CVD (PECVD) or physical vapor deposition
        (PVD/sputtering).
      tags:
        - plasma
        - semiconductor
        - etch
        - deposition

    - term: Wavelength
      definition: >-
        The spatial period of an electromagnetic wave; for optical and
        laser products the wavelength (nm or µm) defines the photon
        energy and the material interactions available. Common MKS laser
        wavelengths include 1064 nm (Nd:YAG fundamental), 532 nm
        (second harmonic), 355 nm (UV), and 1030 nm (Yb:fiber).
      tags:
        - photonics
        - laser
        - optics
        - measurement

    - term: Setpoint
      definition: >-
        The target value for a controlled process variable (pressure,
        flow rate, temperature, power). A controller compares the setpoint
        to the measured actual value and adjusts the actuator output
        (valve position, heater duty cycle, RF power level) to minimize
        steady-state error.
      tags:
        - process-control
        - automation
        - instrumentation

    - term: EtherCAT
      definition: >-
        An Ethernet-based real-time fieldbus standard (IEC 61158) widely
        used for industrial motion control and process automation. Enables
        deterministic, low-latency communication between a master
        controller and distributed I/O nodes such as mass flow controllers,
        servo drives, and digital I/O modules.
      tags:
        - communication
        - fieldbus
        - motion-control
        - industrial-networking

    - term: Throughput
      definition: >-
        In semiconductor manufacturing, the number of wafers or substrates
        processed per unit time (wafers/hour). Throughput is a key
        economic metric driven by process time, robot transfer time,
        chamber count, and equipment availability (uptime).
      tags:
        - semiconductor
        - manufacturing
        - productivity
        - metrics
